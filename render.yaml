# Render Blueprint: Dashboard > New > Blueprint > pick this repository.
# Values marked `sync: false` are entered in the Render dashboard and never
# committed (this repository is public). See docs/DEPLOYMENT.md.
services:
  - type: web
    name: finsight-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # A random 256-bit key generated by Render on first deploy.
      - key: SECRET_KEY
        generateValue: true
      # Neon connection string, e.g. postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      # The public URL of this service, e.g. https://finsight-ai.onrender.com
      - key: PUBLIC_APP_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      # Password-reset email via Brevo SMTP (free tier).
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # e.g. FinSight AI <your-verified-sender@gmail.com>
      - key: MAIL_FROM
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: SEED_DEMO_ON_STARTUP
        value: "true"
      - key: DEMO_NIGHTLY_RESET
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "true"
